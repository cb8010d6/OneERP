name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Run SSH deployment after publishing images"
        required: false
        default: false
        type: boolean
      image_tag:
        description: "Image tag to deploy, for example latest or a commit SHA tag"
        required: false
        default: latest
        type: string

concurrency:
  group: oneerp-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/oneerp
  IMAGE_TAG: ${{ github.event.inputs.image_tag || 'latest' }}

jobs:
  release-preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: eip_user
          POSTGRES_PASSWORD: eip_password
          POSTGRES_DB: eip_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U eip_user"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://eip_user:eip_password@localhost:5432/eip_db_test
      JWT_SECRET: test_secret_for_deploy_preflight
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      MINIO_ENDPOINT: localhost
      MINIO_PORT: 9000
      MINIO_USE_SSL: false
      MINIO_ACCESS_KEY: minio_admin
      MINIO_SECRET_KEY: minio_password
      PORT: 8000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm ci
        working-directory: apps/api

      - name: Install Web dependencies
        run: npm ci
        working-directory: apps/web

      - name: Run dependency security audit
        run: npm run audit:security

      - name: Run Prisma migrations
        run: npx prisma migrate deploy --schema=./prisma/schema.prisma
        working-directory: apps/api

      - name: Run release risk preflight
        run: npm run risk:preflight:db

      - name: Validate Docker Compose files
        run: npm run compose:config

      - name: Validate runtime image manifests
        run: npm run compose:images

      - name: Validate application
        run: npm run validate

  build-api:
    name: Build API image
    needs: release-preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract API metadata
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-api-migrate:
    name: Build API migration image
    needs: release-preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract API migration metadata
        id: meta-api-migrate
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api-migrate
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: builder
          push: true
          tags: ${{ steps.meta-api-migrate.outputs.tags }}
          labels: ${{ steps.meta-api-migrate.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-web:
    name: Build Web image
    needs: release-preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Web metadata
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy over SSH
    needs: [build-api, build-api-migrate, build-web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.ref == 'refs/heads/main' && (vars.DEPLOY_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.deploy == true))

    environment:
      name: production
      url: ${{ vars.APP_URL }}

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      GHCR_USERNAME: ${{ vars.GHCR_USERNAME || github.actor }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_PATH; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing deployment configuration: %s\n' "${missing[*]}"
            printf 'Configure repository secrets DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY and variable DEPLOY_PATH.\n'
            exit 1
          fi

          if ! printf '%s' "$IMAGE_TAG" | grep -Eq '^[A-Za-z0-9_.-]{1,128}$'; then
            printf '::error::Invalid IMAGE_TAG: %s\n' "$IMAGE_TAG"
            printf 'Use a Docker-compatible tag such as latest, main, or a commit SHA tag.\n'
            exit 1
          fi

          if ! printf '%s' "$DEPLOY_PATH" | grep -Eq '^/[A-Za-z0-9._~/-]{1,199}$'; then
            printf '::error::Invalid DEPLOY_PATH: %s\n' "$DEPLOY_PATH"
            printf 'Use an absolute Unix path without spaces, quotes, shell variables, or control characters.\n'
            exit 1
          fi

          if ! printf '%s' "$DEPLOY_USER" | grep -Eq '^[A-Za-z0-9._-]{1,64}$'; then
            printf '::error::Invalid DEPLOY_USER format.\n'
            printf 'Use a simple SSH user name containing only letters, numbers, dot, underscore, or dash.\n'
            exit 1
          fi

          if ! printf '%s' "$DEPLOY_HOST" | grep -Eq '^[A-Za-z0-9._:-]{1,253}$'; then
            printf '::error::Invalid DEPLOY_HOST format.\n'
            printf 'Use a hostname, IPv4 address, IPv6 address, or host:port without shell metacharacters.\n'
            exit 1
          fi

          if ! printf '%s' "$GHCR_USERNAME" | grep -Eq '^[A-Za-z0-9_.-]{1,128}$'; then
            printf '::error::Invalid GHCR_USERNAME format.\n'
            printf 'Use a GitHub username or organization slug without spaces or shell metacharacters.\n'
            exit 1
          fi

      - name: Install SSH key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/oneerp_deploy
          chmod 600 ~/.ssh/oneerp_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Sync production compose file
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/oneerp_deploy "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH/scripts'"
          scp -i ~/.ssh/oneerp_deploy docker-compose.prod.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker-compose.prod.yml"
          scp -i ~/.ssh/oneerp_deploy scripts/audit-prod-config.sh "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/scripts/audit-prod-config.sh"
          scp -i ~/.ssh/oneerp_deploy scripts/deploy-check.sh "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/scripts/deploy-check.sh"
          ssh -i ~/.ssh/oneerp_deploy "$DEPLOY_USER@$DEPLOY_HOST" "chmod +x '$DEPLOY_PATH/scripts/audit-prod-config.sh' '$DEPLOY_PATH/scripts/deploy-check.sh'"

      - name: Audit remote production configuration
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/oneerp_deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && COMPOSE_FILE=docker-compose.prod.yml ENV_FILE=.env sh scripts/audit-prod-config.sh"

      - name: Login remote Docker to GHCR
        if: env.GHCR_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/oneerp_deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login '$REGISTRY' -u '$GHCR_USERNAME' --password-stdin"

      - name: Deploy with Docker Compose
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/oneerp_deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' REGISTRY='$REGISTRY' IMAGE_PREFIX='$IMAGE_PREFIX' IMAGE_TAG='$IMAGE_TAG' bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          export REGISTRY IMAGE_PREFIX IMAGE_TAG
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          docker compose -f docker-compose.prod.yml ps
          docker image prune -f
          REMOTE

      - name: Verify remote deployment
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/oneerp_deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && COMPOSE_FILE=docker-compose.prod.yml ENV_FILE=.env sh scripts/deploy-check.sh"
