# ============================================================
#  OneERP Production Docker Compose
# ============================================================
#  前置条件:
#    1. 复制 .env.example 为 .env 并填写所有生产环境实际值
#    2. 确保 IMAGE_OWNER 设置为你的 GitHub 用户名或组织名
#    3. 确保 POSTGRES_PASSWORD / JWT_SECRET / MINIO_SECRET_KEY 均已设置（无默认值）
#
#  启动命令 (不带 Nginx):
#    docker compose -f docker-compose.prod.yml up -d
#
#  启动命令 (带 Nginx 反向代理):
#    docker compose -f docker-compose.prod.yml --profile with-nginx up -d
#
#  指定镜像版本标签 (默认 latest，用于回滚):
#    IMAGE_TAG=abc1234 docker compose -f docker-compose.prod.yml up -d
# ============================================================

version: '3.8'

services:
  # ---- PostgreSQL Database ----
  db:
    image: postgres:15-alpine
    container_name: oneerp_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eip_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-eip_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eip_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Redis Cache ----
  redis:
    image: redis:7-alpine
    container_name: oneerp_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      # 带密码健康检查: 若 REDIS_PASSWORD 为空则退化为无密码 ping
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a $REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- MinIO Object Storage ----
  minio:
    image: minio/minio:latest
    container_name: oneerp_minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- NestJS API ----
  api:
    # IMAGE_TAG 环境变量用于回滚: 回滚时指定 commit SHA 即可
    image: ${REGISTRY:-ghcr.io}/${IMAGE_OWNER}/oneerp-api:${IMAGE_TAG:-latest}
    container_name: oneerp_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-eip_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-eip_db}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minio_admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      PORT: ${API_PORT:-8000}
      # CORS 白名单 (逗号分隔); 生产环境前端域名需加入此列表
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:${WEB_PORT:-3000}}
      # ---- 可选: AI 功能 (未配置时自动降级为规则引擎) ----
      # OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    ports:
      - "${API_PORT:-8000}:8000"

  # ---- Next.js Web ----
  web:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_OWNER}/oneerp-web:${IMAGE_TAG:-latest}
    container_name: oneerp_web
    restart: always
    depends_on:
      - api
    environment:
      NODE_ENV: production
      # 服务端渲染 (SSR) 时通过 Docker 内部网络访问 API
      # 注意: 变量名必须是 NEXT_PUBLIC_API_BASE_URL (与 apps/web/src/lib/api.ts 一致)
      NEXT_PUBLIC_API_BASE_URL: http://api:${API_PORT:-8000}/api
    ports:
      - "${WEB_PORT:-3000}:3000"

  # ---- Nginx Reverse Proxy (optional) ----
  nginx:
    image: nginx:alpine
    container_name: oneerp_nginx
    restart: always
    depends_on:
      - api
      - web
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    profiles:
      - with-nginx

volumes:
  pgdata:
  redisdata:
  miniodata: