# ============================================================
#  OneERP Production Docker Compose
#  Usage: docker compose -f docker-compose.prod.yml up -d
# ============================================================

version: '3.8'

services:
  # ---- PostgreSQL Database ----
  db:
    image: postgres:15-alpine
    container_name: oneerp_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eip_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-eip_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eip_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Redis Cache ----
  redis:
    image: redis:7-alpine
    container_name: oneerp_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- MinIO Object Storage ----
  minio:
    image: minio/minio:latest
    container_name: oneerp_minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- NestJS API ----
  api:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_OWNER:-your-org}/oneerp-api:latest
    container_name: oneerp_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-eip_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-eip_db}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minio_admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      PORT: ${API_PORT:-8000}
    ports:
      - "${API_PORT:-8000}:8000"

  # ---- Next.js Web ----
  web:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_OWNER:-your-org}/oneerp-web:latest
    container_name: oneerp_web
    restart: always
    depends_on:
      - api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://api:${API_PORT:-8000}
    ports:
      - "${WEB_PORT:-3000}:3000"

  # ---- Nginx Reverse Proxy (optional) ----
  nginx:
    image: nginx:alpine
    container_name: oneerp_nginx
    restart: always
    depends_on:
      - api
      - web
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    profiles:
      - with-nginx

volumes:
  pgdata:
  redisdata:
  miniodata:
