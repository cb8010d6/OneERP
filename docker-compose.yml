services:
  db:
    image: postgres:15-alpine
    container_name: eip_postgres
    restart: always
    environment:
      POSTGRES_USER: eip_user
      POSTGRES_PASSWORD: eip_password
      POSTGRES_DB: eip_db
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - eip_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: eip_redis
    restart: always
    ports:
      - "16379:6379"
    volumes:
      - eip_redisdata:/data

  minio:
    image: minio/minio:RELEASE.2024-01-18T00-31-37Z
    container_name: eip_minio
    restart: always
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - eip_miniodata:/data

volumes:
  eip_pgdata:
  eip_redisdata:
  eip_miniodata:
